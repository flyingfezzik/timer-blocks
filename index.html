<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoFlow - Custom Interval Timer</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_PRESETS = [
      {
        id: 'sit-stand-pomodoro',
        name: 'Pomodoro + Sit/Stand',
        description: '25m Sit Work, 5m Stand Work, 5m Break',
        cycles: 4,
        steps: [
          { id: '1', name: 'Sitting Work', minutes: 25, seconds: 0, color: '#3B82F6', sound: 'chime' },
          { id: '2', name: 'Standing Work', minutes: 5, seconds: 0, color: '#10B981', sound: 'bell' },
          { id: '3', name: 'Rest Break', minutes: 5, seconds: 0, color: '#F59E0B', sound: 'chime' },
        ]
      },
      {
        id: 'ergo-sit-stand',
        name: 'Ergonomic 20-8-2 Rule',
        description: '20m Sitting, 8m Standing, 2m Stretch/Move',
        cycles: 6,
        steps: [
          { id: '1', name: 'Sitting Work', minutes: 20, seconds: 0, color: '#3B82F6', sound: 'chime' },
          { id: '2', name: 'Standing Work', minutes: 8, seconds: 0, color: '#10B981', sound: 'chime' },
          { id: '3', name: 'Stretch & Move', minutes: 2, seconds: 0, color: '#EC4899', sound: 'bell' },
        ]
      }
    ];

    const PRESET_COLORS = [
      { name: 'Blue', hex: '#3B82F6' },
      { name: 'Emerald', hex: '#10B981' },
      { name: 'Amber', hex: '#F59E0B' },
      { name: 'Purple', hex: '#8B5CF6' },
      { name: 'Pink', hex: '#EC4899' },
      { name: 'Teal', hex: '#14B8A6' },
      { name: 'Red', hex: '#EF4444' }
    ];

    function playAudioTone(type = 'chime') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (type === 'silent') return;

        if (type === 'beep') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'chime') {
          const freqs = [523.25, 659.25, 783.99];
          freqs.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.8);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.12);
            osc.stop(ctx.currentTime + idx * 0.12 + 0.85);
          });
        } else if (type === 'bell') {
          const freqs = [440, 880, 1320, 1760];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime);
            gain.gain.setValueAtTime(0.3 / (i + 1), ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1.8);
          });
        }
      } catch (err) {
        console.error("Audio error:", err);
      }
    }

    function App() {
      const [presets, setPresets] = useState(() => {
        const saved = localStorage.getItem('interval_app_presets');
        return saved ? JSON.parse(saved) : DEFAULT_PRESETS;
      });

      const [sessionName, setSessionName] = useState('My Custom Routine');
      const [steps, setSteps] = useState(DEFAULT_PRESETS[0].steps);
      const [targetCycles, setTargetCycles] = useState(4);

      const [isRunning, setIsRunning] = useState(false);
      const [currentStepIndex, setCurrentStepIndex] = useState(0);
      const [currentCycle, setCurrentCycle] = useState(1);
      const [timeLeft, setTimeLeft] = useState(() => (steps[0].minutes * 60 + steps[0].seconds));
      const [soundEnabled, setSoundEnabled] = useState(true);

      const [activeTab, setActiveTab] = useState('timer');
      const [editingStep, setEditingStep] = useState(null);

      const timerRef = useRef(null);

      const getStepDurationSeconds = (step) => (step ? (parseInt(step.minutes || 0) * 60 + parseInt(step.seconds || 0)) : 0);

      const calculateTotalSessionSeconds = () => {
        const cycleTime = steps.reduce((acc, step) => acc + getStepDurationSeconds(step), 0);
        return cycleTime * targetCycles;
      };

      useEffect(() => {
        localStorage.setItem('interval_app_presets', JSON.stringify(presets));
      }, [presets]);

      useEffect(() => {
        if (isRunning) {
          timerRef.current = setInterval(() => {
            setTimeLeft((prevTime) => {
              if (prevTime <= 1) {
                const currentStep = steps[currentStepIndex];
                if (soundEnabled) playAudioTone(currentStep.sound);

                if (currentStepIndex < steps.length - 1) {
                  const nextIndex = currentStepIndex + 1;
                  setCurrentStepIndex(nextIndex);
                  return getStepDurationSeconds(steps[nextIndex]);
                } else {
                  if (currentCycle < targetCycles) {
                    setCurrentCycle(prev => prev + 1);
                    setCurrentStepIndex(0);
                    return getStepDurationSeconds(steps[0]);
                  } else {
                    setIsRunning(false);
                    return 0;
                  }
                }
              }
              return prevTime - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isRunning, currentStepIndex, steps, currentCycle, targetCycles, soundEnabled]);

      const togglePlay = () => setIsRunning(!isRunning);

      const handleReset = () => {
        setIsRunning(false);
        setCurrentStepIndex(0);
        setCurrentCycle(1);
        setTimeLeft(getStepDurationSeconds(steps[0]));
      };

      const handleAddStep = () => {
        const newStep = {
          id: Date.now().toString(),
          name: 'New Interval',
          minutes: 5,
          seconds: 0,
          color: PRESET_COLORS[steps.length % PRESET_COLORS.length].hex,
          sound: 'chime'
        };
        setSteps([...steps, newStep]);
      };

      const handleUpdateStep = (id, key, value) => {
        setSteps(steps.map(s => s.id === id ? { ...s, [key]: value } : s));
      };

      const handleDeleteStep = (id) => {
        if (steps.length <= 1) return;
        const updated = steps.filter(s => s.id !== id);
        setSteps(updated);
        if (currentStepIndex >= updated.length) {
          setCurrentStepIndex(0);
          setTimeLeft(getStepDurationSeconds(updated[0]));
        }
      };

      const handleLoadPreset = (preset) => {
        setIsRunning(false);
        setSessionName(preset.name);
        setSteps(preset.steps);
        setTargetCycles(preset.cycles || 1);
        setCurrentStepIndex(0);
        setCurrentCycle(1);
        setTimeLeft(getStepDurationSeconds(preset.steps[0]));
        setActiveTab('timer');
      };

      const formatTime = (totalSecs) => {
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const currentStep = steps[currentStepIndex] || steps[0];
      const currentStepTotalSecs = getStepDurationSeconds(currentStep);
      const stepProgress = currentStepTotalSecs > 0 ? ((currentStepTotalSecs - timeLeft) / currentStepTotalSecs) * 100 : 0;

      return (
        <div class="max-w-xl mx-auto p-4 md:p-6 min-h-screen flex flex-col justify-between">
          <div>
            <!-- Header Navigation -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
              <h1 class="text-2xl font-bold text-indigo-400">ChronoFlow</h1>
              <div class="flex gap-2 bg-slate-800 p-1 rounded-xl text-sm font-semibold">
                <button 
                  onClick={() => setActiveTab('timer')} 
                  class={`px-3 py-1.5 rounded-lg transition-all ${activeTab === 'timer' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>
                  Timer
                </button>
                <button 
                  onClick={() => setActiveTab('editor')} 
                  class={`px-3 py-1.5 rounded-lg transition-all ${activeTab === 'editor' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>
                  Configure
                </button>
                <button 
                  onClick={() => setActiveTab('presets')} 
                  class={`px-3 py-1.5 rounded-lg transition-all ${activeTab === 'presets' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>
                  Presets
                </button>
              </div>
            </div>

            <!-- TAB 1: TIMER DASHBOARD -->
            {activeTab === 'timer' && (
              <div class="space-y-6">
                <div class="text-center">
                  <h2 class="text-xl font-bold text-slate-200">{sessionName}</h2>
                  <p class="text-slate-400 text-sm">Cycle {currentCycle} of {targetCycles}</p>
                </div>

                <!-- Circular Timer Display -->
                <div class="relative w-64 h-64 mx-auto flex items-center justify-center">
                  <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-slate-800" fill="transparent" />
                    <circle 
                      cx="50" cy="50" r="42" 
                      stroke={currentStep.color || '#3B82F6'} 
                      stroke-width="8" 
                      stroke-dasharray="263.89" 
                      stroke-dashoffset={263.89 - (263.89 * stepProgress) / 100}
                      stroke-linecap="round"
                      fill="transparent" 
                      class="transition-all duration-300"
                    />
                  </svg>
                  <div class="absolute flex flex-col items-center justify-center text-center">
                    <span class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full text-white mb-1" style={{ backgroundColor: currentStep.color }}>
                      {currentStep.name}
                    </span>
                    <span class="text-5xl font-mono font-bold tracking-tight text-white">
                      {formatTime(timeLeft)}
                    </span>
                  </div>
                </div>

                <!-- Timer Controls -->
                <div class="flex items-center justify-center gap-4">
                  <button 
                    onClick={handleReset} 
                    class="p-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-full transition-colors">
                    Reset
                  </button>
                  <button 
                    onClick={togglePlay} 
                    class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-lg rounded-full shadow-lg transition-transform active:scale-95">
                    {isRunning ? 'Pause' : 'Start'}
                  </button>
                  <button 
                    onClick={() => setSoundEnabled(!soundEnabled)} 
                    class={`p-4 rounded-full transition-colors ${soundEnabled ? 'bg-slate-800 text-slate-200' : 'bg-red-900/40 text-red-400'}`}>
                    {soundEnabled ? 'Sound On' : 'Muted'}
                  </button>
                </div>

                <!-- Sequence Steps List -->
                <div class="bg-slate-800/60 border border-slate-800 rounded-2xl p-4">
                  <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Routine Steps</h3>
                  <div class="space-y-2">
                    {steps.map((step, idx) => (
                      <div 
                        key={step.id} 
                        class={`flex items-center justify-between p-3 rounded-xl border transition-all ${idx === currentStepIndex ? 'bg-slate-800 border-indigo-500 shadow-md' : 'bg-slate-900/50 border-slate-800/60 text-slate-400'}`}>
                        <div class="flex items-center gap-3">
                          <span class="w-3 h-3 rounded-full" style={{ backgroundColor: step.color }}></span>
                          <span class="font-medium text-slate-200">{step.name}</span>
                        </div>
                        <span class="font-mono text-sm">{step.minutes}m {step.seconds > 0 ? `${step.seconds}s` : ''}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <!-- TAB 2: ROUTINE EDITOR -->
            {activeTab === 'editor' && (
              <div class="space-y-6">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Routine Title</label>
                  <input 
                    type="text" 
                    value={sessionName} 
                    onChange={(e) => setSessionName(e.target.value)}
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 font-medium focus:outline-none focus:border-indigo-500"
                  />
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Repeat Cycles</label>
                  <input 
                    type="number" 
                    min="1" 
                    max="20" 
                    value={targetCycles} 
                    onChange={(e) => setTargetCycles(Math.max(1, parseInt(e.target.value) || 1))}
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 font-medium focus:outline-none focus:border-indigo-500"
                  />
                </div>

                <div>
                  <div class="flex items-center justify-between mb-3">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Interval Blocks</label>
                    <button 
                      onClick={handleAddStep} 
                      class="text-xs font-bold text-indigo-400 hover:text-indigo-300">
                      + Add Step
                    </button>
                  </div>

                  <div class="space-y-3">
                    {steps.map((step, idx) => (
                      <div key={step.id} class="bg-slate-800 border border-slate-700/80 rounded-xl p-4 space-y-3">
                        <div class="flex items-center justify-between gap-2">
                          <input 
                            type="text" 
                            value={step.name} 
                            onChange={(e) => handleUpdateStep(step.
